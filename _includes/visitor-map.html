<!-- 访客地图组件 -->
{% if site.visitor_map.enabled %}
<div class="visitor-map-section mt-4">
  <div class="text-center">
    {% if site.visitor_map.clustrmaps_id %}
    <script type="text/javascript" id="clustrmaps" src="//clustrmaps.com/map_v2.js?d=R1Ulqk2j1xOZQxF8b-_XgtkcLc17W9BKT-QWA88CsKM&cl=ffffff&w=a"></script>
    {% else %}
      <p class="text-muted">请在 _config.yml 中配置 clustrmaps_id</p>
    {% endif %}
  </div>
</div>

<style>
.visitor-map-section {
  margin-top: 2rem;
  padding: 1rem 0;
}
</style>
{% endif %}
